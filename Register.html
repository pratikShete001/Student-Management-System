<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>University Portal - Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    background:#f4f7fc;
}

.left-panel{
    background:linear-gradient(135deg,#0f172a,#2563eb);
    color:white;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:40px;
    text-align:center;
}

.left-panel img{
    width:80%;
    max-width:420px;
}

.left-panel h1{
    font-weight:700;
    margin-top:20px;
}

.left-panel p{
    opacity:.9;
}

.form-section{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.register-card{
    width:100%;
    max-width:650px;
    background:#fff;
    border-radius:20px;
    padding:35px;
    box-shadow:0 15px 35px rgba(0,0,0,0.08);
}

.logo{
    width:70px;
    height:70px;
    background:#2563eb;
    border-radius:15px;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:auto;
    font-size:30px;
}

.form-control,
.form-select{
    height:50px;
    border-radius:12px;
}

.btn-register{
    height:50px;
    border-radius:12px;
    font-weight:600;
}

@media(max-width:992px){
    .left-panel{
        display:none;
    }
}
</style>
</head>
<body>

<div class="container-fluid">
<div class="row">

    <!-- Left Branding Section -->
    <div class="col-lg-5 left-panel">

        <i class="bi bi-mortarboard-fill display-1"></i>

        <h1>University Portal</h1>

        <p class="mt-3">
            Manage admissions, students, courses,
            attendance and administration from a
            single platform.
        </p>

        <div class="mt-4">
            <h5>Student • Faculty • Administration</h5>
        </div>

    </div>
    

    <!-- Registration Form -->
    <div class="col-lg-7 form-section">

        <div class="register-card">

            <div class="logo mb-3">
                <i class="bi bi-person-plus-fill"></i>
            </div>

            <div class="text-center mb-4">
                <h2>Create Account</h2>
                <p class="text-muted">
                    Register to access the University Portal
                </p>
            </div>

           <form action="Register.jsp" method = "post">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text"
                               class="form-control"
                               placeholder="Enter full name"
                               name = "name">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email"
                               class="form-control"
                               placeholder="Enter email"
                               name = "email">
                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="tel"
                               class="form-control"
                               placeholder="Enter phone"
                               name = "mobile">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Role</label>
                        <select class="form-select" name = "role">
                            <option>Select Role</option>
                            <option>Student</option>
                            <option>Admin</option>
                        </select>
                    </div>

                </div>

                <div class="mb-3">
                    <label class="form-label">Department</label>
                    <select class="form-select" name = "department">
                        <option>Select Department</option>
                        <option>Computer Science</option>
                        <option>Information Technology</option>
                        <option>Mechanical</option>
                        <option>Civil</option>
                        <option>Electronics</option>
                    </select>
                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Password</label>
                        <input type="password"
                               class="form-control"
                               placeholder="Password"
                               name = "password">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password"
                               class="form-control"
                               placeholder="Confirm Password"
                               >
                    </div>

                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input"
                           type="checkbox">
                    <label class="form-check-label">
                        I agree to the Terms And Conditions
                    </label>
                </div>

                <button type = "submit" value="" class="btn btn-primary w-100 btn-register">
                    Create Account
                </button>

                <div class="text-center mt-3">
                    Already have an account?
                    <a href="login.html">Sign In</a>
                </div>

            </form>

        </div>

    </div>
</div>
</div>

</body>
</html>
