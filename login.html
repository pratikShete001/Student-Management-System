<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>University Portal | Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
:root{
    --primary:#1e3a8a;
    --secondary:#2563eb;
}

body{
    min-height:100vh;
    background:#f4f7fc;
    overflow-x:hidden;
    font-family:'Segoe UI',sans-serif;
}

.left-panel{
    min-height:100vh;
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    padding:40px;
}

.left-panel h1{
    font-weight:700;
    margin-top:20px;
}

.left-panel p{
    max-width:450px;
    opacity:.9;
}

.portal-icon{
    font-size:100px;
}

.login-section{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.login-card{
    width:100%;
    max-width:450px;
    background:#fff;
    border-radius:20px;
    padding:40px;
    box-shadow:0 15px 40px rgba(0,0,0,0.08);
}

.logo{
    width:75px;
    height:75px;
    background:var(--secondary);
    color:#fff;
    border-radius:18px;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:auto;
    font-size:32px;
}

.form-control,
.form-select{
    height:50px;
    border-radius:12px;
}

.input-group-text{
    border-radius:12px 0 0 12px;
    background:#fff;
}

.btn-login{
    height:50px;
    border-radius:12px;
    font-weight:600;
}

@media(max-width:992px){
    .left-panel{
        display:none;
    }
}
</style>
</head>
<body>

<div class="container-fluid">
<div class="row">

    <!-- Left Branding Panel -->
    <div class="col-lg-6 left-panel">

        <i class="bi bi-mortarboard-fill portal-icon"></i>

        <h1>University Portal</h1>

        <p class="mt-3">
            Access student records, course management,
            attendance tracking and university administration
            from one centralized platform.
        </p>

        <div class="mt-4">
            <h5>Student • Faculty • Administration</h5>
        </div>

    </div>

    <!-- Login Form -->
    <div class="col-lg-6 login-section">

        <div class="login-card">

            <div class="logo mb-3">
                <i class="bi bi-person-circle"></i>
            </div>

            <div class="text-center mb-4">
                <h2>Welcome Back</h2>
                <p class="text-muted">
                    Sign in to your account
                </p>
            </div>

            <form action="login.jsp" method="post">

                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        Email Address
                    </label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-envelope"></i>
                        </span>

                        <input type="email"
                               name="email"
                               class="form-control"
                               placeholder="Enter your email"
                               required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        Password
                    </label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>

                        <input type="password"
                               name="password"
                               class="form-control"
                               placeholder="Enter your password"
                               required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        Login As
                    </label>

                    <select name="role" class="form-select">
                        <option value="">Select Role</option>
                        <option value="Student">Student</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>

                <div class="d-flex justify-content-between mb-4">
                    <div class="form-check">
                        <input class="form-check-input"
                               type="checkbox"
                               id="remember">
                        <label class="form-check-label"
                               for="remember">
                            Remember Me
                        </label>
                    </div>

                    <a href="#" class="text-decoration-none">
                        Forgot Password?
                    </a>
                </div>

                <button type="submit"
                        class="btn btn-primary w-100 btn-login">
                    Sign In
                </button>

                <div class="text-center mt-4">
                    Don't have an account?
                    <a href="Register.html"
                       class="text-decoration-none">
                        Register Here
                    </a>
                </div>

            </form>
        </div>
    </div>
</div>
</div>

</body>
</html>
